global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "logsage-monitor"

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "logsage-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics/prometheus
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
